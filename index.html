<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Night Sky</title>

<style>

html, body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
}

canvas{
  display:block;
}

#title{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  color:white;
  font-size:2rem;
  letter-spacing:4px;
  z-index:10;
  pointer-events:none;
  text-shadow:
    0 0 10px white,
    0 0 30px rgba(100,150,255,0.6);
}

#label{
  position:absolute;
  color:white;
  background:rgba(0,0,0,0.7);
  padding:10px 14px;
  border-radius:10px;
  pointer-events:none;
  display:none;
  z-index:20;
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(8px);
}

#info{
  position:absolute;
  bottom:25px;
  right:25px;
  width:300px;
  padding:18px;
  border-radius:16px;
  color:white;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);
  z-index:10;
  line-height:1.5;
}

</style>
</head>

<body>

<div id="title">
  Immersive 3D Night Sky
</div>

<div id="label"></div>

<div id="info">
  Drag to rotate the sky.<br>
  Scroll to zoom.<br>
  Hover stars for constellation info.
</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

import { OrbitControls }
from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

/* ------------------ */
/* SCENE */
/* ------------------ */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth/window.innerHeight,
  0.1,
  5000
);

camera.position.set(0,0,1);

const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

/* ------------------ */
/* CONTROLS */
/* ------------------ */

const controls =
  new OrbitControls(
    camera,
    renderer.domElement
  );

controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.rotateSpeed = 0.5;

/* ------------------ */
/* STARFIELD */
/* ------------------ */

const starGeometry =
  new THREE.BufferGeometry();

const starVertices = [];

for(let i=0;i<8000;i++){

  const radius = 2000;

  const theta =
    Math.random() * Math.PI * 2;

  const phi =
    Math.acos(
      (Math.random()*2)-1
    );

  const x =
    radius *
    Math.sin(phi) *
    Math.cos(theta);

  const y =
    radius *
    Math.sin(phi) *
    Math.sin(theta);

  const z =
    radius *
    Math.cos(phi);

  starVertices.push(x,y,z);
}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(
    starVertices,
    3
  )
);

const starMaterial =
  new THREE.PointsMaterial({
    color:0xffffff,
    size:2
  });

const stars =
  new THREE.Points(
    starGeometry,
    starMaterial
  );

scene.add(stars);

/* ------------------ */
/* CONSTELLATION STARS */
/* ------------------ */

const constellationData = [

{
  name:"Betelgeuse",
  desc:"Red supergiant in Orion",
  color:0xff8844,
  position:[600,300,-700],
  size:16
},

{
  name:"Rigel",
  desc:"Blue supergiant in Orion",
  color:0x99ccff,
  position:[700,-150,-650],
  size:14
},

{
  name:"Sirius",
  desc:"Brightest star in night sky",
  color:0xffffff,
  position:[-400,-250,-800],
  size:18
},

{
  name:"Acrux",
  desc:"Brightest star in Crux",
  color:0xaaccff,
  position:[-700,-500,400],
  size:15
},

{
  name:"Antares",
  desc:"Red supergiant in Scorpius",
  color:0xff5533,
  position:[500,100,700],
  size:17
},

{
  name:"Aldebaran",
  desc:"Orange giant in Taurus",
  color:0xffaa66,
  position:[-600,400,500],
  size:14
},

{
  name:"Naos",
  desc:"Blue supergiant in Puppis",
  color:0xaaddff,
  position:[300,-450,600],
  size:13
}

];

const interactiveStars = [];

const texture =
  new THREE.TextureLoader().load(
    "https://threejs.org/examples/textures/sprites/disc.png"
  );

constellationData.forEach(star=>{

  const material =
    new THREE.SpriteMaterial({
      map:texture,
      color:star.color,
      transparent:true,
      blending:THREE.AdditiveBlending
    });

  const sprite =
    new THREE.Sprite(material);

  sprite.position.set(
    ...star.position
  );

  sprite.scale.set(
    star.size,
    star.size,
    1
  );

  sprite.userData = {
    name:star.name,
    desc:star.desc,
    baseSize:star.size
  };

  scene.add(sprite);

  interactiveStars.push(sprite);

});

/* ------------------ */
/* HOVER INTERACTION */
/* ------------------ */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

const label =
  document.getElementById("label");

let mouseX = 0;
let mouseY = 0;

window.addEventListener("mousemove",(e)=>{

  mouse.x =
    (e.clientX/window.innerWidth)*2-1;

  mouse.y =
    -(e.clientY/window.innerHeight)*2+1;

  mouseX = e.clientX;
  mouseY = e.clientY;

});

/* ------------------ */
/* ANIMATE */
/* ------------------ */

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  stars.rotation.y += 0.00015;

  raycaster.setFromCamera(
    mouse,
    camera
  );

  const intersects =
    raycaster.intersectObjects(
      interactiveStars
    );

  interactiveStars.forEach(star=>{

    star.scale.set(
      star.userData.baseSize,
      star.userData.baseSize,
      1
    );

  });

  if(intersects.length > 0){

    const star =
      intersects[0].object;

    star.scale.set(
      star.userData.baseSize * 1.8,
      star.userData.baseSize * 1.8,
      1
    );

    label.style.display = "block";

    label.style.left =
      mouseX + 20 + "px";

    label.style.top =
      mouseY - 20 + "px";

    label.innerHTML =
      "<strong>" +
      star.userData.name +
      "</strong><br>" +
      star.userData.desc;

  } else {

    label.style.display = "none";

  }

  renderer.render(scene,camera);

}

animate();

/* ------------------ */
/* RESIZE */
/* ------------------ */

window.addEventListener("resize",()=>{

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
