<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
      text-align: center;
    }

    header {
      background: #0077ff;
      color: white;
      padding: 60px 20px;
    }

    h1 {
      margin: 0;
      font-size: 3rem;
    }

    p {
      font-size: 1.2rem;
    }

    .container {
      padding: 40px 20px;
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #0077ff;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      background: #222;
      color: white;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Website</h1>
    <p>A free website hosted on GitHub Pages</p>
  </header>

  <div class="container">
    <h2>About</h2>
    <p>This is a simple website made with HTML and CSS.</p>

    <a class="button" href="#">Learn More</a>
  </div>

  <footer>
    <p>© 2026 My Website</p>
  </footer>

</body>
</html>
