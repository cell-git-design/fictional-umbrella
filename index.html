<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Puppis Constellation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(ellipse at bottom, #000 0%, #111 100%);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .sky {
      position: relative;
      width: 90%;
      height: 90%;
    }

    .star {
      position: absolute;
      width: 10px;
      height: 10px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .star:hover {
      transform: scale(2);
      box-shadow: 0 0 15px 5px white;
      z-index: 10;
    }

    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.8);
      padding: 8px 12px;
      border-radius: 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
      max-width: 200px;
    }

    .star:hover + .tooltip {
      opacity: 1;
    }

    /* Optional: connecting lines between stars */
    svg {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    line {
      stroke: white;
      stroke-width: 1;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="sky">
    <!-- Stars with positions -->
    <div class="star" style="top: 40%; left: 20%;" data-name="Naos" data-desc="Brightest star in Puppis."></div>
    <div class="tooltip"></div>

    <div class="star" style="top: 50%; left: 35%;" data-name="Suhail" data-desc="Second brightest star."></div>
    <div class="tooltip"></div>

    <div class="star" style="top: 60%; left: 50%;" data-name="Yed Posterior" data-desc="Moderate brightness star."></div>
    <div class="tooltip"></div>

    <div class="star" style="top: 45%; left: 65%;" data-name="Muhlifain" data-desc="Faint star in the constellation."></div>
    <div class="tooltip"></div>

    <!-- Optional lines connecting stars -->
    <svg>
      <line x1="20%" y1="40%" x2="35%" y2="50%"></line>
      <line x1="35%" y1="50%" x2="50%" y2="60%"></line>
      <line x1="50%" y1="60%" x2="65%" y2="45%"></line>
    </svg>
  </div>

  <script>
    const stars = document.querySelectorAll('.star');
    const tooltips = document.querySelectorAll('.tooltip');

    stars.forEach((star, i) => {
      star.addEventListener('mousemove', (e) => {
        const tooltip = tooltips[i];
        tooltip.style.left = e.offsetX + 15 + 'px';
        tooltip.style.top = e.offsetY - 15 + 'px';
        tooltip.innerHTML = `<strong>${star.dataset.name}</strong><br>${star.dataset.desc}`;
      });

      star.addEventListener('mouseenter', () => {
        tooltips[i].style.opacity = '1';
      });

      star.addEventListener('mouseleave', () => {
        tooltips[i].style.opacity = '0';
      });
    });
  </script>

</body>
</html>
