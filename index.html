<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Constellation Viewer</title>

<style>

html, body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#title {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  color: white;
  font-size: 2rem;
  letter-spacing: 3px;
  z-index: 10;
  pointer-events: none;
}

#info {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 280px;
  padding: 16px;
  color: white;
  background: rgba(255,255,255,0.08);
  border-radius: 12px;
  z-index: 10;
  line-height: 1.5;
  backdrop-filter: blur(8px);
}

#label {
  position: absolute;
  display: none;
  color: white;
  background: rgba(0,0,0,0.7);
  padding: 10px;
  border-radius: 10px;
  pointer-events: none;
  z-index: 20;
}

</style>
</head>

<body>

<div id="title">
  Interactive 3D Night Sky
</div>

<div id="info">
  Drag to rotate the sky.<br>
  Scroll to zoom.<br>
  Hover stars for details.
</div>

<div id="label"></div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

/* SCENE */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  5000
);

camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(renderer.domElement);

/* CONTROLS */

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;
controls.enablePan = false;

/* STARFIELD */

const starGeometry = new THREE.BufferGeometry();

const starVertices = [];

for(let i = 0; i < 10000; i++){

  const x = (Math.random() - 0.5) * 3000;
  const y = (Math.random() - 0.5) * 3000;
  const z = (Math.random() - 0.5) * 3000;

  starVertices.push(x, y, z);
}

starGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(
    starVertices,
    3
  )
);

const starMaterial = new THREE.PointsMaterial({
  color: 0xffffff,
  size: 2
});

const stars = new THREE.Points(
  starGeometry,
  starMaterial
);

scene.add(stars);

/* CONSTELLATION STARS */

const texture = new THREE.TextureLoader().load(
  'https://threejs.org/examples/textures/sprites/disc.png'
);

const starData = [

{
  name: "Sirius",
  desc: "Brightest star in the night sky",
  color: 0xffffff,
  pos: [120, 50, -300],
  size: 25
},

{
  name: "Betelgeuse",
  desc: "Red supergiant in Orion",
  color: 0xff8844,
  pos: [-200, 120, -400],
  size: 30
},

{
  name: "Rigel",
  desc: "Blue supergiant in Orion",
  color: 0x99ccff,
  pos: [-150, -100, -350],
  size: 24
},

{
  name: "Acrux",
  desc: "Brightest star in Crux",
  color: 0xaaddff,
  pos: [300, -200, -450],
  size: 26
},

{
  name: "Antares",
  desc: "Red supergiant in Scorpius",
  color: 0xff5533,
  pos: [350, 100, 200],
  size: 28
}

];

const clickableStars = [];

starData.forEach(data => {

  const material = new THREE.SpriteMaterial({
    map: texture,
    color: data.color,
    transparent: true,
    blending: THREE.AdditiveBlending
  });

  const sprite = new THREE.Sprite(material);

  sprite.position.set(...data.pos);

  sprite.scale.set(
    data.size,
    data.size,
    1
  );

  sprite.userData = {
    name: data.name,
    desc: data.desc,
    size: data.size
  };

  scene.add(sprite);

  clickableStars.push(sprite);

});

/* HOVER */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const label = document.getElementById("label");

let mx = 0;
let my = 0;

window.addEventListener("mousemove", e => {

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  mx = e.clientX;
  my = e.clientY;

});

/* ANIMATION */

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  stars.rotation.y += 0.0002;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(clickableStars);

  clickableStars.forEach(star => {

    star.scale.set(
      star.userData.size,
      star.userData.size,
      1
    );

  });

  if(intersects.length > 0){

    const star = intersects[0].object;

    star.scale.set(
      star.userData.size * 1.5,
      star.userData.size * 1.5,
      1
    );

    label.style.display = "block";

    label.style.left = mx + 15 + "px";
    label.style.top = my - 15 + "px";

    label.innerHTML =
      "<strong>" +
      star.userData.name +
      "</strong><br>" +
      star.userData.desc;

  } else {

    label.style.display = "none";

  }

  renderer.render(scene, camera);

}

animate();

/* RESIZE */

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
