<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Immersive 3D Constellation Map</title>

<style>

html, body{
  margin:0;
  overflow:hidden;
  background:black;
  font-family:Arial, sans-serif;
  height:100%;
}

/* TITLE */

#title{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  color:white;
  z-index:10;
  font-size:2.2rem;
  letter-spacing:4px;
  font-weight:300;
  text-shadow:
    0 0 10px rgba(255,255,255,0.7),
    0 0 30px rgba(100,150,255,0.6);
  pointer-events:none;
}

/* INFO BOX */

#info{
  position:absolute;
  bottom:30px;
  right:30px;
  width:320px;
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,0.06);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  color:rgba(255,255,255,0.85);
  z-index:10;
  line-height:1.5;
}

/* STAR LABEL */

#label{
  position:absolute;
  color:white;
  background:rgba(0,0,0,0.75);
  padding:10px 14px;
  border-radius:10px;
  pointer-events:none;
  transform:translate(-50%, -120%);
  display:none;
  z-index:20;
  font-size:0.95rem;
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(6px);
  box-shadow:
    0 0 15px rgba(255,255,255,0.15);
}

canvas{
  display:block;
}

</style>
</head>

<body>

<div id="title">
  Interactive 3D Night Sky
</div>

<div id="info">
  <strong>Immersive Constellation Viewer</strong><br><br>

  Drag to look around the celestial sphere.<br>
  Scroll to zoom.<br>
  Hover stars for details.<br><br>

  Includes:
  Orion, Crux, Puppis,
  Scorpius, Taurus,
  and Canis Major.
</div>

<div id="label"></div>

<!-- THREE.JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- ORBIT CONTROLS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>

/* ---------------------------
SCENE SETUP
---------------------------- */

const scene = new THREE.Scene();

scene.fog =
  new THREE.FogExp2(0x000000, 0.0007);

const camera =
  new THREE.PerspectiveCamera(
    75,
    window.innerWidth/window.innerHeight,
    0.1,
    5000
  );

camera.position.set(0,0,0.1);

const renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

document.body.appendChild(renderer.domElement);

/* ---------------------------
CONTROLS
---------------------------- */

const controls =
  new THREE.OrbitControls(
    camera,
    renderer.domElement
  );

controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.rotateSpeed = 0.6;
controls.minDistance = 0.1;
controls.maxDistance = 2;

/* ---------------------------
STARFIELD
---------------------------- */

const bgGeometry =
  new THREE.BufferGeometry();

const bgVertices = [];

for(let i=0;i<5000;i++){

  const radius = 1800;

  const theta =
    Math.random()*Math.PI*2;

  const phi =
    Math.acos(
      (Math.random()*2)-1
    );

  const x =
    radius *
    Math.sin(phi) *
    Math.cos(theta);

  const y =
    radius *
    Math.sin(phi) *
    Math.sin(theta);

  const z =
    radius *
    Math.cos(phi);

  bgVertices.push(x,y,z);
}

bgGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(
    bgVertices,
    3
  )
);

const bgMaterial =
  new THREE.PointsMaterial({
    color:0xffffff,
    size:2,
    transparent:true,
    opacity:0.8
  });

const backgroundStars =
  new THREE.Points(
    bgGeometry,
    bgMaterial
  );

scene.add(backgroundStars);

/* ---------------------------
CONSTELLATION STARS
---------------------------- */

const stars = [

{
  name:"Betelgeuse",
  desc:"Red supergiant in Orion",
  color:0xff8855,
  size:10,
  theta:1.2,
  phi:1.1
},

{
  name:"Rigel",
  desc:"Blue supergiant in Orion",
  color:0x99ccff,
  size:9,
  theta:1.35,
  phi:1.4
},

{
  name:"Sirius",
  desc:"Brightest night sky star",
  color:0xffffff,
  size:12,
  theta:2.0,
  phi:1.8
},

{
  name:"Acrux",
  desc:"Brightest star in Crux",
  color:0xaaccff,
  size:10,
  theta:3.0,
  phi:2.1
},

{
  name:"Mimosa",
  desc:"Blue giant in Crux",
  color:0xaaccff,
  size:8,
  theta:3.1,
  phi:2.0
},

{
  name:"Antares",
  desc:"Red supergiant in Scorpius",
  color:0xff6644,
  size:11,
  theta:4.0,
  phi:1.5
},

{
  name:"Aldebaran",
  desc:"Orange giant in Taurus",
  color:0xffaa66,
  size:9,
  theta:5.0,
  phi:1.0
},

{
  name:"Naos",
  desc:"Blue supergiant in Puppis",
  color:0xaaddff,
  size:9,
  theta:2.7,
  phi:2.3
}

];

const starObjects = [];

const starTexture =
  new THREE.TextureLoader().load(
    "https://threejs.org/examples/textures/sprites/disc.png"
  );

stars.forEach(star=>{

  const radius = 1000;

  const x =
    radius *
    Math.sin(star.phi) *
    Math.cos(star.theta);

  const y =
    radius *
    Math.cos(star.phi);

  const z =
    radius *
    Math.sin(star.phi) *
    Math.sin(star.theta);

  const material =
    new THREE.SpriteMaterial({
      map:starTexture,
      color:star.color,
      transparent:true,
      blending:THREE.AdditiveBlending
    });

  const sprite =
    new THREE.Sprite(material);

  sprite.position.set(x,y,z);

  sprite.scale.set(
    star.size,
    star.size,
    1
  );

  sprite.userData = {
    name:star.name,
    desc:star.desc
  };

  scene.add(sprite);

  starObjects.push(sprite);

});

/* ---------------------------
RAYCASTING
---------------------------- */

const raycaster =
  new THREE.Raycaster();

const mouse =
  new THREE.Vector2();

const label =
  document.getElementById("label");

window.addEventListener(
  "mousemove",
  event=>{

    mouse.x =
      (event.clientX /
      window.innerWidth)*2-1;

    mouse.y =
      -(event.clientY /
      window.innerHeight)*2+1;

  }
);

/* ---------------------------
ANIMATION
---------------------------- */

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  backgroundStars.rotation.y += 0.0001;

  raycaster.setFromCamera(
    mouse,
    camera
  );

  const intersects =
    raycaster.intersectObjects(
      starObjects
    );

  if(intersects.length>0){

    const obj = intersects[0].object;

    label.style.display = "block";

    label.innerHTML =
      "<strong>" +
      obj.userData.name +
      "</strong><br>" +
      obj.userData.desc;

    label.style.left =
      event.clientX + "px";

    label.style.top =
      event.clientY + "px";

    obj.scale.set(18,18,1);

  } else {

    label.style.display = "none";

    starObjects.forEach(star=>{

      const original =
        stars.find(
          s=>s.name===star.userData.name
        );

      star.scale.set(
        original.size,
        original.size,
        1
      );

    });

  }

  renderer.render(scene,camera);
}

animate();

/* ---------------------------
RESIZE
---------------------------- */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
