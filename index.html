<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>3D Night Sky - Planetarium Mode</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background: radial-gradient(circle at bottom,
    #0b1430 0%,
    #05060c 50%,
    #000000 100%);
  font-family:Arial, sans-serif;
  color:white;
}

/* TITLE */

h1{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  font-weight:300;
  letter-spacing:5px;
  font-size:2.4rem;
  z-index:1000;
  text-shadow:0 0 25px rgba(120,180,255,0.5);
}

/* SKY CONTAINER */

.sky{
  position:relative;
  width:100vw;
  height:100vh;
  perspective:1200px;
  transform-style:preserve-3d;
}

/* STARS */

.star-group{
  position:absolute;
  transform:translate(-50%, -50%);
  text-align:center;
  transition:transform 0.15s ease;
  animation:drift 10s ease-in-out infinite alternate;
}

.star{
  width:10px;
  height:10px;
  border-radius:50%;
  background:white;
  box-shadow:0 0 12px white;
  transition:transform 0.25s ease;
}

.star-group:hover .star{
  transform:scale(2.8);
  box-shadow:
    0 0 25px white,
    0 0 60px rgba(120,180,255,0.8);
}

/* LABEL */

.label{
  margin-top:10px;
  width:240px;
  font-size:0.8rem;
  opacity:0;
  transform:translateY(10px);
  transition:all 0.3s ease;
  color:rgba(255,255,255,0.7);
  pointer-events:none;
}

.star-group:hover .label{
  opacity:1;
  transform:translateY(-6px);
  color:white;
}

/* CONSTELLATION LABEL */

.constellation-label{
  position:absolute;
  padding:10px 14px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:12px;
  backdrop-filter:blur(8px);
  opacity:0;
  transition:all 0.3s ease;
  pointer-events:none;
}

/* SVG LINES */

svg{
  position:absolute;
  width:100%;
  height:100%;
  pointer-events:none;
}

path{
  fill:none;
  stroke:rgba(170,220,255,0.85);
  stroke-width:2.2;
  filter:drop-shadow(0 0 8px rgba(120,180,255,0.8));
  stroke-dasharray:1000;
  stroke-dashoffset:1000;
  opacity:0;
  transition:stroke-dashoffset 1s ease, opacity 0.4s ease;
}

/* DRIFT */

@keyframes drift{
  0%{ transform:translate(-50%,-50%) translate(0px,0px); }
  100%{ transform:translate(-50%,-50%) translate(3px,2px); }
}

</style>
</head>

<body>

<h1>Planetarium Sky Viewer</h1>

<div class="sky" id="sky">

<svg id="lines"></svg>
<div id="label" class="constellation-label"></div>

<!-- ORION -->
<div class="star-group" data-c="Orion" data-o="1" style="left:65%; top:25%;">
  <div class="star"></div>
  <div class="label"><b>Betelgeuse</b><br>Red supergiant nearing supernova stage</div>
</div>

<div class="star-group" data-c="Orion" data-o="2" style="left:70%; top:38%;">
  <div class="star"></div>
  <div class="label"><b>Alnilam</b><br>Central belt star of Orion</div>
</div>

<div class="star-group" data-c="Orion" data-o="3" style="left:76%; top:50%;">
  <div class="star"></div>
  <div class="label"><b>Rigel</b><br>Blue supergiant ~860 ly away</div>
</div>

<!-- CRUX -->
<div class="star-group" data-c="Crux" data-o="1" style="left:82%; top:66%;">
  <div class="star"></div>
  <div class="label"><b>Mimosa</b><br>Hot blue giant star</div>
</div>

<div class="star-group" data-c="Crux" data-o="2" style="left:86%; top:75%;">
  <div class="star"></div>
  <div class="label"><b>Acrux</b><br>Brightest star in Southern Cross</div>
</div>

<div class="star-group" data-c="Crux" data-o="3" style="left:90%; top:66%;">
  <div class="star"></div>
  <div class="label"><b>Gacrux</b><br>Red giant marking top of cross</div>
</div>

</div>

<script>

const sky = document.getElementById("sky");
const svg = document.getElementById("lines");
const label = document.getElementById("label");

let mouseX = 0;
let mouseY = 0;
let smoothX = 0;
let smoothY = 0;

/* -----------------------------
MOUSE + INERTIA CAMERA
----------------------------- */

document.addEventListener("mousemove", (e)=>{

  mouseX = (e.clientX / window.innerWidth - 0.5);
  mouseY = (e.clientY / window.innerHeight - 0.5);

});

function animateSky(){

  smoothX += (mouseX - smoothX) * 0.05;
  smoothY += (mouseY - smoothY) * 0.05;

  sky.style.transform =
    `rotateY(${smoothX * 12}deg)
     rotateX(${-smoothY * 12}deg)`;

  requestAnimationFrame(animateSky);
}

animateSky();

/* -----------------------------
BUILD CONSTELLATION CURVES
(using smooth quadratic curves)
----------------------------- */

function drawCurve(points){

  let d = `M ${points[0].x} ${points[0].y}`;

  for(let i=1;i<points.length-1;i++){

    const midX = (points[i].x + points[i+1].x) / 2;
    const midY = (points[i].y + points[i+1].y) / 2;

    d += ` Q ${points[i].x} ${points[i].y} ${midX} ${midY}`;
  }

  const path = document.createElementNS(
    "http://www.w3.org/2000/svg",
    "path"
  );

  path.setAttribute("d", d);
  svg.appendChild(path);

  requestAnimationFrame(()=>{
    path.style.opacity = 1;
    path.style.strokeDashoffset = 0;
  });

  return path;
}

/* -----------------------------
HOVER LOGIC
----------------------------- */

let activePath = null;

const stars = document.querySelectorAll(".star-group");

stars.forEach(star=>{

  star.addEventListener("mouseenter", ()=>{

    const c = star.dataset.c;

    const group =
      [...document.querySelectorAll(`[data-c="${c}"]`)]
      .sort((a,b)=>a.dataset.o - b.dataset.o);

    const pts = group.map(el=>{
      const r = el.getBoundingClientRect();
      return {
        x:r.left + r.width/2,
        y:r.top + r.height/2
      };
    });

    if(activePath){
      activePath.remove();
    }

    activePath = drawCurve(pts);

    label.style.opacity = 1;
    label.textContent = c;

    const r = star.getBoundingClientRect();
    label.style.left = r.left + "px";
    label.style.top = (r.top - 30) + "px";

  });

  star.addEventListener("mouseleave", ()=>{

    if(activePath){
      activePath.style.opacity = 0;
      setTimeout(()=>activePath.remove(), 400);
      activePath = null;
    }

    label.style.opacity = 0;

  });

});

/* -----------------------------
ZOOM (scroll = depth illusion)
----------------------------- */

let zoom = 1;

document.addEventListener("wheel", (e)=>{

  zoom += e.deltaY * -0.001;
  zoom = Math.min(Math.max(0.7, zoom), 1.6);

  sky.style.transform += ` scale(${zoom})`;

});

</script>

</body>
</html>
